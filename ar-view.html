<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NSBM AR Navigation</title>
    <!-- A-Frame and AR.js Libraries -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .ui-panel {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); padding: 12px 25px; border-radius: 20px;
            text-align: center; font-family: sans-serif; font-weight: bold; z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 80%; max-width: 350px;
            color: #14212e;
        }
        .back-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #d63c3c; color: white; border: none; padding: 16px 35px;
            border-radius: 30px; font-size: 1.1rem; font-weight: bold; z-index: 9999;
            font-family: sans-serif; box-shadow: 0 6px 20px rgba(214, 60, 60, 0.4);
            cursor: pointer;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Top Info Panel -->
    <div class="ui-panel">
        📷 AR Navigation Active<br>
        <span style="font-size:0.85rem; color:#5d6b7a; font-weight: normal;">Look around to find your destination</span>
    </div>

    <!-- Exit Button -->
    <button class="back-btn" onclick="window.location.href='index.html'">
        End AR Route
    </button>

    <!-- AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        
        <!-- Floating 3D Arrow and Text -->
        <a-entity position="0 1.5 -4" animation="property: position; to: 0 1.8 -4; dir: alternate; dur: 1200; loop: true">
            <!-- 3D Cone (Arrow head) -->
            <a-cone position="0 0.5 0" radius-bottom="0.4" radius-top="0" height="0.8" color="#0f6fd1" rotation="90 0 0"></a-cone>
            <!-- 3D Cylinder (Arrow body) -->
            <a-cylinder position="0 -0.2 0" radius="0.15" height="1" color="#0f6fd1" rotation="90 0 0"></a-cylinder>
            
            <!-- Floating Text Board -->
            <a-text value="50m to Faculty of Computing" align="center" position="0 1.5 0" color="#ffffff" width="5" 
                    geometry="primitive: plane; height: 0.5; width: 3.5" material="color: #14212e; opacity: 0.8; radius: 0.1">
            </a-text>
        </a-entity>

        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

</body>
</html>
